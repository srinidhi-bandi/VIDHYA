<!DOCTYPE html>
<html>
<head>
    <title>Counter App</title>
</head>

<body>

<h1>Counter App</h1>

<h2 id="count">0</h2>

<button onclick="increase()">Increase</button>
<button onclick="decrease()">Decrease</button>
<button onclick="reset()">Reset</button>

<script>

let counter = 0;

function increase() {
    counter++;
    document.getElementById("count").innerText = counter;
}

function decrease() {
    counter--;
    document.getElementById("count").innerText = counter;
}

function reset() {
    counter = 0;
    document.getElementById("count").innerText = counter;
}

</script>

</body>
</html>
